[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pytunnel"
version = "0.3.0"
description = "A ngrok-like tunneling application in Python with enterprise features"
readme = "README.md"
requires-python = ">=3.8"
license = {text = "MIT"}
authors = [
    {name = "PyTunnel"},
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dependencies = [
    "aiohttp>=3.9.1",
    "websockets>=12.0",
    "uvicorn>=0.25.0",
    "python-dotenv>=1.0.0",
    "colorama>=0.4.6",
    "cryptography>=41.0.7",
    "rich>=13.7.0",
    "click>=8.1.7",
    "psutil>=5.9.6",
    "questionary>=2.0.1",
    "geoip2>=4.7.0",
]

[project.scripts]
pytunnel-server = "pytunnel.server.cli:main"
pytunnel-client = "pytunnel.client.cli:main"
pytunnel-status = "pytunnel.cli_status:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["pytunnel*"]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21",
    "pytest-cov>=4.0",
]
